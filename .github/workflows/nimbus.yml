name: Nimbus overlay

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run Nimbus tests
        run: node --test nimbus/test/*.test.js nimbus/windows-agent/test/*.test.js
      - name: CLI disk smoke
        run: |
          STATE="${RUNNER_TEMP}/nimbus-ci"
          node nimbus/cli/nimbus.mjs --state "$STATE" memory learn --key ci --value ok
          test -f "$STATE/memory.json"
          node nimbus/cli/nimbus.mjs permissions apply --config "$STATE/openclaw.json"
          grep -q '"mode": "deny"' "$STATE/openclaw.json"
