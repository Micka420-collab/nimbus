name: Nimbus overlay

on:
  push:
    paths:
      - "nimbus/**"
      - ".github/workflows/nimbus.yml"
      - "CHANGELOG-NIMBUS.md"
  pull_request:
    paths:
      - "nimbus/**"
      - ".github/workflows/nimbus.yml"
      - "CHANGELOG-NIMBUS.md"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Nimbus tests
        run: node --test nimbus/test/*.test.js
