<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Nimbus contrôle le bureau</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        padding: 0 16px;
        background: #8b2e24;
        color: #fff8f4;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      strong {
        font-size: 15px;
      }
      span {
        font-size: 12px;
        opacity: 0.9;
      }
      button {
        background: #fff8f4;
        color: #8b2e24;
        border: 0;
        border-radius: 6px;
        padding: 6px 10px;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div>
        <strong>Nimbus contrôle le bureau</strong><br />
        <span id="status">En cours — Échap pour arrêter</span>
      </div>
      <button id="stop" type="button">Arrêter</button>
    </div>
    <script>
      const status = document.getElementById("status");
      window.nimbusAgent.onState((state) => {
        status.textContent = `${state.astra?.hud?.statusLabel ?? ""} — ${state.astra?.brief ?? ""}`.trim();
      });
      document.getElementById("stop").addEventListener("click", () => {
        window.nimbusAgent.astra({ op: "abort" });
      });
    </script>
  </body>
</html>
