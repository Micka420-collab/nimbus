<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>Nimbus contrôle</title>
    <style>
      html,
      body {
        margin: 0;
        background: #11161f;
        color: #f3f4f6;
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
      }
      main {
        padding: 10px 14px;
      }
      strong {
        color: #ffb020;
      }
      #brief {
        color: #9aa3b2;
        margin: 6px 0;
        min-height: 1.2em;
      }
      button {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Nimbus contrôle le bureau</strong>
      <p id="brief"></p>
      <button type="button" id="approve">Approuver</button>
      <button type="button" id="deny">Refuser</button>
      <button type="button" id="abort">Arrêter (Échap)</button>
    </main>
    <script>
      const briefEl = document.getElementById("brief");
      const hud = window.nimbusHud;
      document.getElementById("approve").onclick = () => hud?.approve();
      document.getElementById("deny").onclick = () => hud?.deny();
      document.getElementById("abort").onclick = () => hud?.abort();
      hud?.onState((snapshot) => {
        briefEl.textContent = snapshot?.astra?.brief ?? "";
      });
    </script>
  </body>
</html>
