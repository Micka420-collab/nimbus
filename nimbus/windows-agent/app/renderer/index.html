<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nimbus Windows Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Nimbus Windows Agent</h1>
      <p class="sub">Nœud OpenClaw — voix PTT + contrôle bureau (mode Astra)</p>
      <p id="trayStatus" class="status" aria-live="polite"></p>
    </header>

    <section>
      <h2>Appairage</h2>
      <label>URL du Gateway
        <input id="url" type="text" autocomplete="off" placeholder="wss://gateway.exemple:18789" />
      </label>
      <label>Jeton ou code d'installation
        <input id="token" type="password" autocomplete="off" />
      </label>
      <button id="pair" type="button">Enregistrer et appairer</button>
      <p id="pairStatus" class="status" aria-live="polite"></p>
    </section>

    <section>
      <h2>Voix <span class="hint">chemin Nimbus — pas d'audio Astra</span></h2>
      <p id="mic" class="mic" data-live="off">Micro inactif</p>
      <button id="consent" type="button">Autoriser l'écoute</button>
      <button id="ptt" type="button">Maintenir pour parler</button>
      <button id="conversation" type="button">Démarrer la conversation</button>
      <p id="voiceStatus" class="status"></p>
    </section>

    <section>
      <h2>Contrôle bureau (mode Astra)</h2>
      <p id="astraStatus" class="status">Inactif</p>
      <label>Objectif
        <input id="brief" type="text" placeholder="ouvre le Bloc-notes et écris hello" />
      </label>
      <p id="astraBrief" class="status"></p>
      <button id="run" type="button">Exécuter</button>
      <button id="approve" type="button">Confirmer cette étape</button>
      <button id="abort" type="button">Arrêter (Échap)</button>
    </section>
    <script src="./app.js"></script>
  </body>
</html>
